<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 946 160" role="img" aria-label="VULTRON" shape-rendering="crispEdges">
<title>VULTRON</title>
<!-- THE VULTRON WORDMARK, built as pixel cells on a 5x7 grid (cell 20, track 40) and merged
     into the fewest rectangles per glyph so the edges stay solid when scaled.
     It doubles as a CSS MASK: css/style.css paints the chrome mark through this silhouette,
     which is why the letters need no colour of their own. The amber fill serves the direct
     <img> use on the title screen. Keep the 946x160 viewBox ratio: .logo-img and #logo-anchor
     reserve their seats from it, and the word is centred inside that frame. -->
<g fill="#f5a623"><rect x="3" y="10" width="20" height="80"/><rect x="83" y="10" width="20" height="80"/><rect x="23" y="90" width="20" height="40"/><rect x="63" y="90" width="20" height="40"/><rect x="43" y="130" width="20" height="20"/><rect x="143" y="10" width="20" height="120"/><rect x="223" y="10" width="20" height="120"/><rect x="163" y="130" width="60" height="20"/><rect x="283" y="10" width="20" height="140"/><rect x="303" y="130" width="80" height="20"/><rect x="423" y="10" width="100" height="20"/><rect x="463" y="30" width="20" height="120"/><rect x="563" y="10" width="80" height="20"/><rect x="563" y="30" width="20" height="120"/><rect x="643" y="30" width="20" height="40"/><rect x="583" y="70" width="60" height="20"/><rect x="603" y="90" width="20" height="20"/><rect x="623" y="110" width="20" height="20"/><rect x="643" y="130" width="20" height="20"/><rect x="723" y="10" width="60" height="20"/><rect x="703" y="30" width="20" height="100"/><rect x="783" y="30" width="20" height="100"/><rect x="723" y="130" width="60" height="20"/><rect x="843" y="10" width="20" height="140"/><rect x="923" y="10" width="20" height="140"/><rect x="863" y="30" width="20" height="20"/><rect x="883" y="50" width="20" height="20"/><rect x="903" y="70" width="20" height="20"/></g>
</svg>
